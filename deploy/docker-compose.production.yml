# deploy/docker-compose.production.yml
# Entwurf — NICHT gestartet. Keine echten Secrets enthalten, siehe .env.production.example.
#
# Persistente Verzeichnisse sind benannte Docker-Volumes (nicht anonym),
# überleben Container-Neustart, -Rebuild und `docker compose down` (ohne -v).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Kein "ports:" — PostgreSQL ist ausschließlich im internen Compose-Netz
    # erreichbar, nicht auf dem Host-Interface exponiert.
    environment:
      POSTGRES_DB: business_webapp
      POSTGRES_USER: business_webapp
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports:
      # Nur Loopback, NICHT öffentlich — ermöglicht `prisma migrate deploy`
      # vom Deploy-Host selbst (siehe Aufgabe 8: Migration läuft host-seitig,
      # nicht aus dem schlanken Runtime-Image, das bewusst kein prisma-CLI
      # enthält — "prisma" ist devDependency, "@prisma/client" ist Laufzeit-
      # Abhängigkeit, siehe Dockerfile-Kommentar). Von außerhalb des Hosts
      # nicht erreichbar.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_webapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production   # nicht eingecheckt — siehe .env.production.example
    volumes:
      # Volume A — STORAGE_LOCAL_PATH: Firmenlogo, Kundenbestellungen (falls
      # Archiv deaktiviert), allgemeine Uploads, Collaboration-/GGA-Dokumente.
      - uploads:/app/storage/documents
      # Volume B — Dokumentenarchiv (company_settings.document_archive_path).
      # Getrenntes Volume, da dieser Pfad DB-konfiguriert und unabhängig von
      # STORAGE_LOCAL_PATH ist (siehe Aufgabe-2-Matrix). Wird auf einer neuen
      # Installation durch deploy/initial-production-setup.ts einmalig auf
      # diesen Pfad gesetzt (siehe Aufgabe 5) — NICHT durch eine Migration.
      - archive:/app/archive
    ports:
      - "127.0.0.1:3000:3000"   # nur lokal — Caddy terminiert TLS und proxied dorthin
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  uploads:
  archive:
  caddy-data:
  caddy-config:

secrets:
  db_password:
    file: ./secrets/db_password.txt   # nicht eingecheckt, lokal auf dem Server anlegen
